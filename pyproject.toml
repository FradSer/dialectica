[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "dialectica"
version = "0.7.0"
description = "A reasoning-engine toolbox: a composable Workflow kernel (agent/parallel/pipeline) plus an execution-guided repair engine (generate -> verify -> repair)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Frad LEE", email = "fradser@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "google-adk>=2.11.0",
    "litellm>=1.103.2",
    "pydantic>=2.13.5",
]

[dependency-groups]
dev = [
    "huggingface-hub>=1.33.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-bdd>=9.0.0",
    "python-dotenv>=1.2.4",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
# Skip the live-API E2E tests by default; opt in with `uv run pytest -m e2e`
# (configured model) or `uv run pytest -m e2e_access` (cliproxy access lists).
addopts = "-m 'not e2e and not e2e_access'"
markers = [
    "e2e: end-to-end tests against the configured real model (Gemini by default)",
    "e2e_access: end-to-end access-list test against a cliproxy/OpenAI-compatible endpoint (requires OPENAI_API_BASE + OPENAI_API_KEY + DEFAULT_MODEL_CONFIG=openai:...)",
]
filterwarnings = [
    # ADK: BaseAgentConfig deprecation — frozen by ADK's pin on
    # opentelemetry-api<1.43; cannot upgrade until ADK does.
    'ignore:BaseAgentConfig is deprecated:DeprecationWarning',
    # OpenTelemetry 1.42.x: SelectableGroups deprecation — same constraint.
    'ignore:SelectableGroups dict interface is deprecated:DeprecationWarning',
    # Suppress only ADK's experimental API notices.
    'ignore:.*EXPERIMENTAL.*:UserWarning:google.adk.*',
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
# pyflakes (F) + pycodestyle (E) are on by default; add isort import sorting.
extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
# Dev tools (evals/, examples/, tests/) are reference code, not shipped API.
# Ruff 0.16 expanded the default ruleset from 59 to 413 rules; suppress the
# new violations in these directories to avoid churn in reference code.
"evals/**/*.py" = [
    "PLW1510", # subprocess.run without check (intentional in eval harness)
    "BLE001",  # blind exception (intentional in eval harness)
    "S112",    # try-except-continue (intentional in eval harness)
]
"examples/**/*.py" = [
    "BLE001",  # blind exception (intentional in reference patterns)
    "RUF022",  # __all__ not sorted (intentional grouping)
]
"tests/**/*.py" = [
    "BLE001",  # blind exception (intentional in test harness)
]

[tool.hatch.build.targets.wheel]
packages = ["dialectica"]
